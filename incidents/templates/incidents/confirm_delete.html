<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Incidente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center">
                <h3 class="text-danger mb-4">¿Eliminar incidente de seguridad?</h3>
                <p>Esta acción no se puede deshacer. ¿Estás seguro de que deseas borrar: <strong>"{{ object.title }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100">Sí, eliminar permanentemente</button>
                </form>
                <a href="{% url 'incidents:home' %}" class="btn btn-light w-100 mt-2">Cancelar</a>
            </div>
        </div>
    </div>
</body>
</html>
