<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Incidente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4>Detalle de Incidente #{{ incident.id }}</h4>
            </div>
            <div class="card-body">
                <h2 class="card-title">{{ incident.title }}</h2>
                <hr>
                <p><strong>Descripción:</strong></p>
                <p class="bg-light p-3 rounded border">{{ incident.description }}</p>
                
                <p><strong>Severidad:</strong> <span class="badge bg-secondary">{{ incident.severity }}</span></p>
                <p><strong>Estado:</strong> 
                    {% if incident.resolved %}
                    <span class="badge bg-success">Solucionado</span>
                    {% else %}
                    <span class="badge bg-danger">Bajo Investigación</span>
                    {% endif %}
                </p>
                <p class="text-muted small">Reportado el: {{ incident.reported_at }}</p>
                <hr>
                <a href="{% url 'incidents:home' %}" class="btn btn-primary">Volver al Panel</a>
            </div>
        </div>
    </div>
</body>
</html>
