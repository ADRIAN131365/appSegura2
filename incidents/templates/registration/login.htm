<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login — Cyber Incident System</title>
</head>

<body style="font-family:Arial;
background:#0f0f1a;
color:#cdd6f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0">

<div style="background:#1e1e2e;
padding:40px;
border-radius:8px;
width:300px;
border:1px solid #45475a">

<h2 style="color:#89b4fa; text-align: center;">
    🔐 Secure Login
</h2>

{% if form.errors %}
    <div style="color: #f38ba8; background: #313244; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center; border: 1px solid #f38ba8;">
        Usuario o contraseña incorrectos.
    </div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    
    <div style="margin-bottom: 15px;">
        {{ form.as_p }}
    </div>

    <button type="submit"
    style="background:#89b4fa;
    color:#1e1e2e;
    padding:10px 24px;
    border:none;
    border-radius:4px;
    width:100%;
    font-weight:bold;
    cursor: pointer;">
        Login
    </button>
</form>

</div>
</body>
</html>
