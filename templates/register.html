<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-container { margin-top: 80px; max-width: 400px; }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Crear Cuenta</h3>
            
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label">Elige un Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej: ana_dev" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="****" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarme ahora</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/login" class="small">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
